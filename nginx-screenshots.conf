# Nginx config — serves screenshots as public files
# Copy to: /etc/nginx/sites-available/lovable-parser
# Enable:  sudo ln -s /etc/nginx/sites-available/lovable-parser /etc/nginx/sites-enabled/
# Reload:  sudo nginx -s reload

server {
    listen 80;
    server_name 81.91.177.137;  # replace with your IP or domain

    location /screenshots/ {
        alias /home/ubuntu/lovable-parser/data/screenshots/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
